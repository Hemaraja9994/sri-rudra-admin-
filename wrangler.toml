# Sri Rudra portal-plus — new look + clinician dashboards in front of the admin portal.
# Address: https://admin.srirudraspeechandhearing.com only. There is no workers.dev address.
# The route admin.srirudraspeechandhearing.com/* (failure mode: Fail open) is set in the
# Cloudflare dashboard. Do not add `routes` here: every deploy would then replace that route.
name = "sri-rudra-portal-plus"
main = "worker/index.js"
compatibility_date = "2026-01-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# The admin portal's own database. Only the new clin_* tables are written;
# appointments, test_reports, ha_trials, ha_sales, clinics and brands are only read.
[[d1_databases]]
binding = "DB"
database_name = "sri-rudra-portal-db"
database_id = "81888080-d782-4f47-adab-a26b68afb6ba"
migrations_dir = "migrations"

# Uploaded patient files (records, reports, photos). The clin_files table is the index.
[[kv_namespaces]]
binding = "FILES"
id = "f4dfc54c08304490b67cd423852cd9b0" # sri-rudra-clinical-files

# Cloudflare Workers AI (free daily allowance): reads uploaded records, drafts reports and plans.
[ai]
binding = "AI"

[vars]
# Only used in local development; on the live address everything goes to the portal directly.
PORTAL_ORIGIN = "https://sri-rudra-portal.pages.dev"
PRODUCTION_HOST = "admin.srirudraspeechandhearing.com"

[observability]
enabled = true
